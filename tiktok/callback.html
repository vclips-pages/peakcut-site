<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PeakCut - connecting TikTok</title>
<body style="font:16px/1.6 system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px">
<p id="m">Connecting to PeakCut on this computer…</p>
<script>
  // TikTok sends the sign-in answer here; it is passed straight on to PeakCut running on this same computer.
  // Only TikTok's two answer values are passed on, nothing from the page is ever turned into code, and nothing is
  // stored or sent anywhere else.
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  ["code", "state", "error", "error_description", "scopes"].forEach(function (k) { if (q.get(k)) out.set(k, q.get(k)); });
  var next = "http://127.0.0.1:8765/oauth/tiktokviews/callback?" + out.toString();
  var a = document.createElement("a");
  a.href = next;
  a.textContent = "click here";
  var m = document.getElementById("m");
  m.textContent = "Connecting to PeakCut on this computer… If nothing happens, ";
  m.appendChild(a);
  location.replace(next);
</script>
</body>
